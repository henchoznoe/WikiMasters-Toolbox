name: Publish Chrome extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    if: vars.CWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download the released Chrome package
        run: |
          node scripts/release-package.mjs --validate-tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
          gh release download "$RELEASE_TAG" --pattern "wikimasters-toolbox-${RELEASE_TAG#v}.zip" --dir artifacts
          node scripts/release-package.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/publish-chrome.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
