name: Release

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Create release
        id: release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Synchronize release back to develop
        run: |
          if [ -f artifacts/release-tag.txt ]; then
            node scripts/sync-release.mjs "$(cat artifacts/release-tag.txt)"
          fi
      - name: Dispatch Chrome publication
        if: always() && steps.release.outcome == 'success' && vars.CWS_ENABLED == 'true'
        run: |
          if [ -f artifacts/release-tag.txt ]; then
            gh workflow run publish-chrome.yml --ref main -f tag="$(cat artifacts/release-tag.txt)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
